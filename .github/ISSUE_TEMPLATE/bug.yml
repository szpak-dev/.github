name: Bug report
description: Report a reproducible defect in existing behavior
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        Keep the report project-facing. Do not include conversation history, agent instructions, local paths, credentials, or private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible or developer-visible behavior is broken?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include only versions and configuration relevant to reproduction.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable conditions that prove the defect is fixed.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue describing the same defect.
          required: true
        - label: I verified the reproduction and removed sensitive or machine-local information.
          required: true
